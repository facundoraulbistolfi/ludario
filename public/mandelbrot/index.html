    .nav-panel,.nav-panel *,.show-nav{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.nav-step-control button{width:78px;height:30px;padding:0 3px;border:1px solid #70949c;border-radius:7px;background:#1e3a4b;color:#eafffa;font-size:12px;touch-action:manipulation}.nav-step-control button:active{background:#327272}.fixed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.fixed-grid button{min-height:40px;border:1px solid #638394;border-radius:9px;background:#203a4c;color:#eafffa;font-size:13px;font-weight:650}.fixed-grid button.selected{border-color:var(--accent);background:#1b5659}.fixed-custom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.fixed-custom label{font-size:12px;color:#cbdde3}.fixed-custom input{margin-top:6px}.fixed-status{min-height:28px;margin:9px 0;color:#b5ddd9;font-size:13px;line-height:1.45}.fixed-actions{display:flex;gap:8px}.fixed-actions button{flex:1}.fixed-note{color:#aebfca;font-size:12px;line-height:1.45;margin:9px 0 0}
    .nav-step-control button:after{content:' ›';opacity:.8}.fixed-details{margin:14px 0;border:1px solid #4e6777;border-radius:13px;background:#132433}.fixed-details summary{cursor:pointer;padding:14px;color:#d2f9f6;font-size:14px;font-weight:700;list-style:none}.fixed-details summary::-webkit-details-marker{display:none}.fixed-details summary:after{content:'▾';float:right}.fixed-details[open] summary:after{content:'▴'}.fixed-details[open] summary{border-bottom:1px solid #4e6777}.fixed-content{padding:12px 13px 15px}.fixed-content .helper{margin:0 0 8px}
    .top-status{display:flex;align-items:center;gap:6px;flex:none}.render-ring{width:24px;height:24px;flex:none;pointer-events:none;filter:drop-shadow(0 0 5px #65e6d977)}.render-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}.render-ring .ring-track{fill:none;stroke:#d5fff75e;stroke-width:3}.render-ring .ring-fill{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:56.55;stroke-dashoffset:56.55;transition:stroke-dashoffset .12s linear}@media(max-width:360px){.top-status{gap:3px}.render-ring{width:20px;height:20px}.top-status .pill{font-size:10px;padding:5px}}

</head>
<body>
<div class="app">
  <a class="ludario-back" href="../#/" target="_top" aria-label="Volver a Ludario" title="Volver a Ludario">📚</a>
  <canvas id="fractal" aria-label="Conjunto de Mandelbrot. Elegí un centro y usá los controles para navegar."></canvas>
  <header class="top"><button type="button" class="brand" id="openPoints" aria-label="Abrir puntos de interés" aria-controls="pointsDrawer" aria-expanded="false"><span class="brand-mark" aria-hidden="true">◌</span><div>Mandelbrot<small>EXPLORADOR</small></div><span class="menu-cue" aria-hidden="true">☰</span></button><div class="top-status"><div class="render-ring hidden-el" id="renderProgress" role="progressbar" aria-label="Carga de la imagen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring-track" cx="12" cy="12" r="9"></circle><circle class="ring-fill" id="renderProgressArc" cx="12" cy="12" r="9"></circle></svg></div><button type="button" class="pill" id="zoomLabel" aria-label="Abrir iteraciones y colores">1× · 180 iter.</button></div></header>
  <div class="hint" id="hint">Usá las flechas para explorar</div>
  <button type="button" class="shared-badge hidden-el" id="sharedBadge"></button>
  <div class="target-banner hidden-el" id="targetBanner" role="status">Tocá el punto que querés poner en el centro <button type="button" id="cancelTarget">Cancelar</button></div>
  <div class="suggestion-markers" id="suggestionMarkers" aria-label="Centros sugeridos"></div>
  <div class="center-marker" id="centerMarker" aria-label="Centro de la vista"><span class="reticle"><span class="reticle-dot"></span></span><small>CENTRO</small></div>
  <div class="nav-panel" id="navigation" role="group" aria-label="Controles de navegación">
    <div class="nav-main"><div class="arrow-pad"><button type="button" data-nav="up" aria-label="Mover arriba">↑</button><button type="button" data-nav="left" aria-label="Mover izquierda">←</button><button type="button" data-nav="right" aria-label="Mover derecha">→</button><button type="button" data-nav="down" aria-label="Mover abajo">↓</button></div><div class="nav-tuning"><div class="zoom-actions"><button type="button" id="zoomOut" aria-label="Alejar del centro">−</button><button type="button" id="zoomIn" aria-label="Acercar al centro">+</button></div><div class="nav-step-control"><span>Zoom por toque</span><button type="button" id="zoomStep" aria-label="Paso de zoom: 2 aumentos. Tocar para cambiar">2×</button></div><div class="nav-step-control"><span>Mover</span><button type="button" id="navStep" aria-label="Paso de movimiento: 10 por ciento. Tocar para cambiar">10%</button></div></div><div class="utility-rail"><button type="button" id="reset" aria-label="Volver a la vista inicial" title="Vista inicial">⌖</button><button type="button" id="suggestCenters" aria-label="Sugerir centros" title="Sugerir centros">✦</button><button type="button" id="hideControls" aria-label="Ocultar controles" title="Ocultar controles">⌄</button></div></div>
    <div class="suggestion-control" id="suggestionControl"><span id="suggestionStatus" role="status" aria-live="polite">Analizando la imagen…</span><button type="button" id="cancelSuggestions">Cancelar</button></div>
  </div>
  <button type="button" class="show-nav hidden-el" id="showControls" aria-label="Mostrar controles" title="Mostrar controles">⌃</button>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="points-drawer" id="pointsDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert><div class="drawer-head"><h2 id="drawerTitle">Puntos de interés</h2><button class="close" type="button" id="closeDrawer" aria-label="Cerrar puntos">×</button></div><div class="drawer-tools"><button type="button" id="drawerMark">Marcar centro</button><button type="button" id="drawerGo">Ir a coordenadas</button></div><div class="drawer-content" id="drawerContent"></div></aside>
  <section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" aria-hidden="true"><div class="handle"></div><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" type="button" id="close" aria-label="Cerrar panel">×</button></div><div id="sheetBody"></div></section>
</div>
<script src="./app.js" defer></script>
</body>
</html>
